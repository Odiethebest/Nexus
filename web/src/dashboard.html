<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f1;
      color: #1a1a18;
      min-height: 100vh;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 8px;
    }
    .page-title { font-size: 18px; font-weight: 500; }
    .status-row { display: flex; align-items: center; gap: 6px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #E24B4A;
      transition: background 0.3s;
    }
    .dot.connected { background: #639922; }
    .status-text { font-size: 12px; color: #888780; }

    /* ── Main grid ── */
    .dash {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 16px;
      padding: 12px 24px 24px;
      min-height: calc(100vh - 60px);
    }

    /* ── Panel ── */
    .panel {
      background: #ffffff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 500;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Form fields ── */
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: #5f5e5a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    input[type="text"], select, textarea {
      width: 100%;
      background: #f5f4f1;
      border: 0.5px solid rgba(0,0,0,0.18);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      color: #1a1a18;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: rgba(0,0,0,0.35);
      box-shadow: 0 0 0 3px rgba(83, 74, 183, 0.08);
    }
    textarea {
      resize: vertical;
      min-height: 90px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23888780' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
      cursor: pointer;
    }

    /* ── Priority badge ── */
    .priority-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-high   { background: #FAECE7; color: #993C1D; }
    .badge-medium { background: #FAEEDA; color: #854F0B; }
    .badge-low    { background: #EAF3DE; color: #3B6D11; }

    /* ── Publish button ── */
    .publish-btn {
      background: #534AB7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
      margin-top: auto;
    }
    .publish-btn:hover  { background: #3C3489; }
    .publish-btn:active { transform: scale(0.98); }

    /* ── Notifications panel ── */
    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notif-count {
      background: #f5f4f1;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      color: #888780;
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 40px 0;
    }
    .empty-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #f5f4f1;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-title { font-size: 14px; font-weight: 500; }
    .empty-sub {
      font-size: 12px; color: #888780;
      text-align: center; max-width: 180px; line-height: 1.5;
    }

    /* ── Notification list ── */
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 360px;
    }
    .notif-item {
      background: #f5f4f1;
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .notif-item-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .notif-type {
      font-size: 12px; font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .notif-meta { display: flex; align-items: center; gap: 6px; }
    .notif-time { font-size: 11px; color: #b4b2a9; }
    .notif-payload {
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #5f5e5a;
      line-height: 1.5;
      word-break: break-all;
    }
  </style>
</head>
<body>

<header class="page-header">
  <span class="page-title">Nexus Dashboard</span>
  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span class="status-text" id="statusText">disconnected</span>
  </div>
</header>

<main class="dash">

  <!-- Left: Publish form -->
  <div class="panel">
    <span class="panel-title">Publish Event</span>

    <div class="field-group">
      <label class="field-label">Type</label>
      <input type="text" id="eventType" value="order" placeholder="e.g. order, payment, alert" />
    </div>

    <div class="field-group">
      <label class="field-label">
        Priority
        <span class="priority-badge badge-high" id="priorityBadge">high</span>
      </label>
      <select id="prioritySelect" onchange="updateBadge(this.value)">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Payload (JSON)</label>
      <textarea id="payload">{"user_id":"u123","email":"user@example.com"}</textarea>
    </div>

    <button class="publish-btn" onclick="publishEvent()">Publish</button>
  </div>

  <!-- Right: Notifications -->
  <div class="panel" style="gap:0">
    <div class="notif-header" style="margin-bottom:16px">
      <span class="panel-title">Live Notifications</span>
      <span class="notif-count" id="notifCount">0 events</span>
    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5C5 1.5 3 3.5 3 6.5V10l-1.5 1.5v.5h13V11.5L13 10V6.5C13 3.5 11 1.5 8 1.5Z"
                stroke="#b4b2a9" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M6.5 12.5a1.5 1.5 0 003 0"
                stroke="#b4b2a9" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="empty-title">Waiting for events</span>
      <span class="empty-sub">Publish one using the form on the left</span>
    </div>

    <div class="notif-list" id="notifList" style="display:none"></div>
  </div>

</main>

<script>
  const events = [];

  /* ── Priority badge ── */
  function updateBadge(v) {
    const b = document.getElementById('priorityBadge');
    const map = { high: 'badge-high', medium: 'badge-medium', low: 'badge-low' };
    b.className = 'priority-badge ' + map[v];
    b.textContent = v;
  }

  /* ── Publish ── */
  function publishEvent() {
    const type     = document.getElementById('eventType').value.trim() || 'event';
    const priority = document.getElementById('prioritySelect').value;
    const raw      = document.getElementById('payload').value.trim();
    let payload;
    try { payload = JSON.stringify(JSON.parse(raw)); } catch { payload = raw; }

    events.unshift({ type, priority, payload, time: new Date() });
    renderEvents();
  }

  /* ── Render ── */
  function renderEvents() {
    const list  = document.getElementById('notifList');
    const empty = document.getElementById('emptyState');
    const count = document.getElementById('notifCount');

    if (!events.length) {
      empty.style.display = 'flex';
      list.style.display  = 'none';
      return;
    }

    empty.style.display = 'none';
    list.style.display  = 'flex';
    count.textContent   = events.length + (events.length === 1 ? ' event' : ' events');

    const badgeMap = { high: 'badge-high', medium: 'badge-medium', low: 'badge-low' };

    list.innerHTML = events.map(ev => {
      const mins    = Math.floor((Date.now() - ev.time) / 60000);
      const timeStr = mins < 1 ? 'just now' : mins + 'm ago';
      return `
          <div class="notif-item">
            <div class="notif-item-header">
              <span class="notif-type">${ev.type}</span>
              <div class="notif-meta">
                <span class="priority-badge ${badgeMap[ev.priority]}">${ev.priority}</span>
                <span class="notif-time">${timeStr}</span>
              </div>
            </div>
            <span class="notif-payload">${ev.payload}</span>
          </div>`;
    }).join('');
  }

  /* ── WebSocket（替换为真实地址即可）── */

</script>

</body>
</html>
