[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.worker"

[deploy]
startCommand = "/app/worker"
# Zero-downtime rolling deploys rely on Kafka consumer-group rebalance:
# when Railway boots the new instance, it joins the consumer groups and
# the coordinator revokes partitions from the old instance. Our runner
# uses BlockRebalanceOnPoll so revocation only happens between poll
# cycles, i.e. after in-flight records have been committed. On SIGTERM
# the runner then flushes any remaining committed offsets before exit.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Env (Railway dashboard):
#   KAFKA_BROKERS / KAFKA_SASL_* / KAFKA_TLS=true (Redpanda Cloud)
#   KAFKA_TOPIC_PARTITIONS  (must match the producer)
#   KAFKA_REPLICATION_FACTOR = 3
#   POSTGRES_DSN / REDIS_URL
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / EMAIL_FROM (optional)
