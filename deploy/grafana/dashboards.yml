apiVersion: 1

# Grafana dashboards provider — recursively loads every JSON under
# /etc/grafana/provisioning/dashboards. Currently that is dashboards/
# nexus-kafka.json; the pre-Kafka board was removed because its latency
# panels queried nexus_publish_duration_seconds, which nothing observes.
providers:
  - name: nexus-dashboards
    folder: Nexus
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
