services:
  # Redpanda (Kafka-protocol) — single-node KRaft. Chosen over Apache
  # Kafka + ZK for local dev because it boots in ~3s and needs one
  # container. Wire-compatible with any Kafka client (franz-go here).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.5
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
    ports:
      # 19092 is the "external" listener for host tools (rpk, kaf, etc.).
      # In-cluster services use redpanda:9092.
      - "19092:19092"
      # Admin API (topic auto-create introspection, metrics passthrough).
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.producer
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC_PARTITIONS: "12"
      KAFKA_REPLICATION_FACTOR: "1"
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
      METRICS_INTERNAL_URL: http://worker:9091/metrics
      LISTEN_ADDR: ":8080"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC_PARTITIONS: "12"
      KAFKA_REPLICATION_FACTOR: "1"
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgres://nexus:nexus@postgres:5432/nexus?sslmode=disable
      EMAIL_WORKER_POOL: "10"
      INAPP_WORKER_POOL: "5"
      WEBHOOK_WORKER_POOL: "8"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - producer
      - worker

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Land on the pipeline board, not whatever Grafana picks first.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dashboards/nexus-kafka.json
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
